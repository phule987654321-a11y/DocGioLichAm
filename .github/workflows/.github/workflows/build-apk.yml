name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project files
        shell: bash
        run: |
          echo "=== FILES ==="
          find . -type f | sort

      - name: Prepare Android project
        shell: bash
        run: |
          MAIN=$(find . -type f -name "MainActivity.java" | head -1)
          HTML=$(find . -type f -name "index.html" | head -1)
          MANIFEST=$(find . -type f -name "AndroidManifest.xml" | head -1)
          STRINGS=$(find . -type f -name "strings.xml" | head -1)
          STYLES=$(find . -type f -name "styles.xml" | head -1)

          echo "MainActivity: $MAIN"
          echo "HTML: $HTML"
          echo "Manifest: $MANIFEST"
          echo "Strings: $STRINGS"
          echo "Styles: $STYLES"

          test -n "$MAIN"
          test -n "$HTML"
          test -n "$MANIFEST"

          mkdir -p app/src/main/java/com/example/docgiolicham
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          cp "$MAIN" app/src/main/java/com/example/docgiolicham/MainActivity.java
          cp "$HTML" app/src/main/assets/index.html
          cp "$MANIFEST" app/src/main/AndroidManifest.xml

          if [ -n "$STRINGS" ]; then
            cp "$STRINGS" app/src/main/res/values/strings.xml
          fi

          if [ -n "$STYLES" ]; then
            cp "$STYLES" app/src/main/res/values/styles.xml
          fi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DocGioLichAm"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.docgiolicham'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.docgiolicham'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
